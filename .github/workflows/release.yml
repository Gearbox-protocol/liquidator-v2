name: Release

on:
  push:
    branches:
      - "main"
      - "beta"
      - "*.x"
  workflow_dispatch:

env:
  HUSKY: 0
  CI: true

jobs:
  release:
    runs-on: ubuntu-26.04
    environment: ${{ github.ref_name }}
    permissions:
      contents: write
      issues: write
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true

      - name: Verify
        run: |
          pnpm build
          pnpm typecheck:ci
          pnpm check:ci
          pnpm test --passWithNoTests

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish packages
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          NPM_TAG="${{ steps.semantic.outputs.new_release_channel }}"
          pnpm -r exec pnpm pkg set version=${{ steps.semantic.outputs.new_release_version }}
          pnpm -r publish --no-git-checks --access public --provenance --tag "${NPM_TAG:-latest}"
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set up QEMU
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build & push liquidator-v2
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: liquidator
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PACKAGE_VERSION=${{ steps.semantic.outputs.new_release_version }}
          tags: |
            ghcr.io/gearbox-protocol/liquidator-v2:${{ steps.semantic.outputs.new_release_version }}
            ghcr.io/gearbox-protocol/liquidator-v2:${{ vars.MOVING_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push optimist
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: optimist
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OPTIMIST_VERSION=${{ steps.semantic.outputs.new_release_version }}
            OPTIMIST_TAG=${{ vars.MOVING_TAG }}
          tags: |
            ghcr.io/gearbox-protocol/optimist:${{ steps.semantic.outputs.new_release_version }}
            ghcr.io/gearbox-protocol/optimist:${{ vars.MOVING_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
