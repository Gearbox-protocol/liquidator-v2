extraHeaderTag: "Fork ${EXECUTION_ID}"
loki: "${sm.ANVIL_NODE.lokiUrl}"
dockerNetwork: "${DOCKER_NETWORK}"
originRPC: "${ANVIL_URL}"
anvilManagerApiURL: "https://anvil.gearbox.foundation/api"
logLevel: debug
ghcrCredentials:
  username: ${sm.ANVIL_NODE.githubUser}
  password: ${sm.ANVIL_NODE.githubToken}

liquidators:
  - id: wallet
    name: "Wallet"
    imageTag: "beta"
    env:
      LIQUIDATION_MODE: "wallet-full"
      LIQUIDATOR_ADDRESS: "0x185E17894F5716753F857129C98E2BCCEd7e36FD"
    setup:
      zeroLT: true
      fundUnderlying: true
      kyc: {}
  - id: wallet-partial
    name: "Wallet Partial"
    imageTag: "beta"
    env:
      LIQUIDATION_MODE: "wallet-partial"
      LIQUIDATOR_ADDRESS: "0x185E17894F5716753F857129C98E2BCCEd7e36FD"
    setup:
      # liquidator lowers LTs of each account itself
      fundUnderlying: true
      kyc: {}
